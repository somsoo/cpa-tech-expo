name: Auto Publish (Hub & Spoke 3-Pass)

on:
  schedule:
    - cron: '42 22,4,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests pillow python-dotenv

      - name: Run Auto Poster (3-Pass Critic-Rewrite with Auto-Retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: python auto_poster.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/ assets/ used_keywords.txt POST_LOG.md || true
          git commit -m "docs: auto-generate 3-pass spoke post and update keyword queue" || echo "No changes to commit"
          for i in 1 2 3; do
            git pull --rebase origin main || true
            git push origin main && break || {
              if [ $i -eq 3 ]; then echo "Git push failed after 3 attempts"; exit 1; fi
              echo "Push failed, retrying in 5 seconds..."
              sleep 5
            }
          done
