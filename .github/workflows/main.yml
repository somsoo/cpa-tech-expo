name: Auto Poster

on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y fonts-nanum
        pip install google-generativeai requests pytz pillow
    - name: Run script
      env:
        GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
      run: python auto_poster.py
    - name: Commit and Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add _posts/ assets/
        git commit -m "Auto-post generated by Gemini AI" || exit 0
        git push
