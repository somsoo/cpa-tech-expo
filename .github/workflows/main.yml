name: Auto Poster

on:
  schedule:
    - cron: '43 5,17 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y fonts-nanum
        pip install google-generativeai requests pytz pillow
    - name: Run script
      env:
        GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
      run: |
        for i in 1 2 3; do
          echo "Attempt $i to run auto_poster.py..."
          python auto_poster.py && break || {
            if [ $i -eq 3 ]; then echo "Auto poster failed after 3 attempts"; exit 1; fi
            echo "Failed, retrying in 15 seconds..."
            sleep 15
          }
        done
    - name: Commit and Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add _posts/ assets/
        git commit -m "Auto-post generated by Gemini AI" || exit 0
        for i in 1 2 3; do
          git pull --rebase origin main || true
          git push origin main && break || {
            if [ $i -eq 3 ]; then echo "Git push failed after 3 attempts"; exit 1; fi
            echo "Push failed, retrying in 5 seconds..."
            sleep 5
          }
        done
