---
layout: default
---
<article class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-8 md:p-12 lg:p-16 mt-6">
  <header class="mb-8 text-center">
    <h1 class="text-2xl md:text-4xl font-extrabold text-gray-900 leading-tight mb-4">{{ page.title | escape }}</h1>
    <div class="text-gray-400 text-sm font-medium">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    </div>
  </header>

  {% if page.image %}
  <div class="w-full aspect-video rounded-xl overflow-hidden mb-10 bg-gray-100 shadow-inner">
    <img src="{{ page.image | relative_url }}" class="w-full h-full object-cover" alt="Hero Image">
  </div>
  {% endif %}

  <!-- 蹂몃Ц ?곸뿭 -->
    <!-- 공정위 대가성 문구 (2024년 개정법 준수) -->
  <div class="mb-8 p-4 bg-gray-50 border-l-4 border-gray-400 text-gray-600 text-sm md:text-base font-semibold rounded-r-lg shadow-sm">
    📢 이 포스팅은 제휴마케팅 활동의 일환으로, 이에 따른 일정액의 수수료를 지급받습니다.
  </div>

  <div class="prose prose-blue prose-lg md:prose-xl max-w-none text-gray-700 leading-relaxed">
    {{ content }}
  </div>
</article>
